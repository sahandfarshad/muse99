name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Test and build (linux amd64 + arm64)
        run: |
          go vet ./...
          go test ./...
          GOOS=linux GOARCH=amd64 go build -o muse99-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o muse99-linux-arm64 .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            muse99-linux-amd64
            muse99-linux-arm64
          generate_release_notes: true
