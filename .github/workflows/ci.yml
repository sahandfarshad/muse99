name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build -o muse99 .

      - name: Build Windows desktop app
        run: |
          GOOS=windows go vet ./...
          GOOS=windows GOARCH=amd64 go build -ldflags "-H=windowsgui" -o Muse99.exe .

      - name: Smoke test (no API key needed)
        run: ./muse99 --help

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: muse99-linux-amd64
          path: muse99

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: muse99-windows
          path: Muse99.exe
